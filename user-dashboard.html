<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      /* White + Brown theme */
      --bg:#f7f5f2;
      --card:#ffffff;
      --card-2:#f3ece6;
      --accent:#8b5e34;
      --accent-2:#b98b5d;
      --text:#1a110b;
      --muted:#6b5a4a;
      --success:#2c7a4b;
      --danger:#c0392b;
      --chip-bg:#efe7df;
      --shadow: 0 8px 24px rgba(27,17,11,.08);
      --radius: 20px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,Helvetica,sans-serif}
    .container{max-width:1200px;margin:0 auto;padding:24px}

    /* Top bar */
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .brand{display:flex;gap:12px;align-items:center}
    .brand__logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--shadow)}
    .brand__title{font-weight:700;letter-spacing:.3px}
    .topbar__right{display:flex;gap:10px;align-items:center}
    .chip{padding:6px 10px;border-radius:999px;background:var(--chip-bg);color:var(--text);font-size:12px;border:1px solid rgba(27,17,11,.08)}

    /* Grid */
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
    .col-4{grid-column:span 4}
    .col-6{grid-column:span 6}
    .col-8{grid-column:span 8}
    .col-12{grid-column:span 12}
    @media (max-width:980px){
      .col-4,.col-6,.col-8{grid-column:span 12}
    }

    /* Cards */
    .card{background:linear-gradient(180deg,var(--card),var(--card-2));border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(27,17,11,.08);overflow:hidden}
    .card__header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(27,17,11,.08)}
    .card__title{font-size:16px;font-weight:700;letter-spacing:.2px}
    .card__body{padding:18px}
    .btn{appearance:none;border:none;background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
    .btn--ghost{background:transparent;color:var(--accent);border:1px solid rgba(27,17,11,.15)}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    /* Account tile */
    .account{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center}
    .avatar{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;font-weight:900}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px}
    .kv .k{color:var(--muted)}
    .kv .v{font-weight:600; overflow-wrap:anywhere; word-break:break-all;}

    /* Devices list */
    .devices{display:flex;flex-direction:column;gap:12px}
    .device{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 14px;border-radius:14px;border:1px solid rgba(27,17,11,.08)}
    .device .meta{display:flex;gap:14px;align-items:center}
    .status{font-size:12px;padding:4px 8px;border-radius:999px}
    .status--online{background:rgba(39,174,96,.15);color:var(--success);border:1px solid rgba(39,174,96,.35)}
    .status--offline{background:rgba(231,76,60,.15);color:var(--danger);border:1px solid rgba(231,76,60,.35)}
    .pill{padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.03);border:1px solid rgba(27,17,11,.08);font-size:12px}

    /* Tables */
    table{width:100%;border-collapse:separate;border-spacing:0 10px}
    thead th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:0 10px}
    tbody tr{background:#fff}
    tbody td{padding:12px 10px;border-top:1px solid rgba(27,17,11,.08);border-bottom:1px solid rgba(27,17,11,.08)}
    tbody tr:first-child td{border-top-left-radius:12px;border-top-right-radius:12px}
    tbody tr:last-child td{border-bottom-left-radius:12px;border-bottom-right-radius:12px}

    /* Auth modal */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
    .modal__card{background:#fff;border-radius:16px;max-width:420px;width:100%;box-shadow:var(--shadow);border:1px solid rgba(27,17,11,.08)}
    .modal__head{padding:16px 18px;border-bottom:1px solid rgba(27,17,11,.08);font-weight:700}
    .modal__body{padding:18px;display:flex;flex-direction:column;gap:12px}
    .input{padding:10px 12px;border-radius:10px;border:1px solid rgba(27,17,11,.15);font:inherit}
    .row{display:flex;gap:10px;justify-content:flex-end}
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="brand__logo"></div>
        <div class="brand__title">User Dashboard</div>
      </div>
      <div class="topbar__right">
        <span id="userEmailChip" class="chip">Signed out</span>
        <button id="openLoginBtn" class="btn--ghost btn" title="Sign in">Sign in</button>
        <button id="signOutBtn" class="btn btn--ghost" title="Sign out" style="display:none">Sign out</button>
      </div>
    </div>

    <div class="grid">
      <!-- Account (made wider) -->
      <section class="card col-6" id="accountCard">
        <header class="card__header">
          <div class="card__title">Account</div>
          <button class="btn btn--ghost" id="editProfileBtn">Edit</button>
        </header>
        <div class="card__body">
          <div class="account">
            <div class="avatar" id="avatar">U</div>
            <div class="kv">
              <div class="k">Name</div><div class="v" id="accName">—</div>
              <div class="k">Email</div><div class="v" id="accEmail">—</div>
              <div class="k">User ID</div><div class="v" id="accUid">—</div>
            </div>
            <div>
              <div class="pill" id="planPill">Plan: Free</div>
            </div>
          </div>

          <!-- ▼▼ ONLY ADDITION: two fill-in boxes (no other changes) ▼▼ -->
          <div style="margin-top:14px; display:grid; grid-template-columns:120px 1fr; gap:8px 12px;">
            <label for="macField" style="color:var(--muted); font-size:12px; align-self:center;">MAC ID</label>
            <input id="macField" class="input" placeholder="e.g., 78:42:1C:CF:46:EE" autocomplete="off"/>

            <label for="pwdField" style="color:var(--muted); font-size:12px; align-self:center;">Password</label>
            <input id="pwdField" class="input" type="password" placeholder="Enter device password"/>
          </div>
          <!-- ▲▲ ONLY ADDITION ▲▲ -->

        </div>
      </section>

      <!-- Devices (now half row too) -->
      <section class="card col-6" id="devicesCard">
        <header class="card__header">
          <div class="card__title">My Devices</div>
          <div>
            <button class="btn btn--ghost" id="refreshDevicesBtn">Refresh</button>
            <button class="btn" id="addDeviceBtn">+ Add</button>
          </div>
        </header>
        <div class="card__body">
          <div id="devicesList" class="devices"></div>
        </div>
      </section>

      <!-- Events -->
      <section class="card col-12" id="eventsCard">
        <header class="card__header">
          <div class="card__title">Events</div>
          <button class="btn btn--ghost" id="refreshEventsBtn">Refresh</button>
        </header>
        <div class="card__body">
          <div style="overflow:auto">
            <table>
              <thead>
                <tr>
                  <th>Event</th>
                  <th>Device</th>
                  <th>Days</th>
                  <th>Time</th>
                  <th>Work/Pause</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="eventsTbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Registered Users -->
      <section class="card col-12" id="usersCard">
        <header class="card__header">
          <div class="card__title">Registered Users</div>
          <div>
            <input id="userSearch" class="input" placeholder="Search email or role"/>
            <button class="btn btn--ghost" id="refreshUsersBtn">Refresh</button>
          </div>
        </header>
        <div class="card__body">
          <div style="overflow:auto">
            <table>
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Devices</th>
                </tr>
              </thead>
              <tbody id="usersTbody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal" aria-hidden="true">
    <div class="modal__card">
      <div class="modal__head">Sign in (Email / Password)</div>
      <div class="modal__body">
        <input id="loginEmail" class="input" type="email" placeholder="Email"/>
        <input id="loginPass" class="input" type="password" placeholder="Password"/>
        <div id="loginMsg" style="color:var(--danger);min-height:18px;font-size:13px;"></div>
        <div class="row">
          <button id="closeLoginBtn" class="btn btn--ghost">Cancel</button>
          <button id="doLoginBtn" class="btn">Sign in</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

  <script>
    /***********************
     * FIREBASE CONFIG     *
     ***********************/
    var firebaseConfig = {
      apiKey: "AIzaSyBcspj0dr9gQT_KvGXofCu-FCoFiQrGsK0",
      authDomain: "smart-aroma-mob-app.firebaseapp.com",
      projectId: "smart-aroma-mob-app",
      storageBucket: "smart-aroma-mob-app.firebasestorage.app",
      messagingSenderId: "447169756481",
      appId: "1:447169756481:web:49b4d914f2a0a7c2db75c0"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db   = firebase.firestore();

    /***********************
     * HELPERS             *
     ***********************/
    function $(q){ return document.querySelector(q); }
    function pad2(n){ n = parseInt(n,10); if(isNaN(n)) return '00'; return (n<10? '0'+n : ''+n); }
    function setChip(text){ var el = $('#userEmailChip'); if(el){ el.textContent = text; } }
    function setAvatarFromName(name){
      var letter = (name||'U').toString().trim();
      letter = letter ? letter.charAt(0).toUpperCase() : 'U';
      var av = $('#avatar'); if(av){ av.textContent = letter; }
    }
    function makeStatusSpan(isOnline){
      var s = document.createElement('span');
      s.className = 'status ' + (isOnline ? 'status--online' : 'status--offline');
      s.textContent = isOnline ? 'Online' : 'Offline';
      return s;
    }

    /***********************
     * RENDERERS           *
     ***********************/
    function renderDevices(list){
      var host = $('#devicesList'); if(!host) return;
      host.innerHTML = '';
      if(!list || list.length===0){
        var empty = document.createElement('div');
        empty.className = 'device';
        empty.innerHTML = '<div class="meta">No devices found</div>';
        host.appendChild(empty);
        return;
      }
      for(var i=0;i<list.length;i++){
        var d = list[i];
        var row = document.createElement('div'); row.className='device';
        var left = document.createElement('div'); left.className='meta';
        var name = d.name || d.deviceName || d.title || d.deviceId || 'Device';
        var ip   = d.ip || d.ipAddress || d.localIp || '—';
        left.innerHTML = '<strong>'+name+'</strong><span class="pill">'+ip+'</span>';
        var right = document.createElement('div');
        var st = (d.status||'').toString().toLowerCase();
        var online = (typeof d.online==='boolean') ? d.online : (st==='online'||st==='active'||st==='connected');
        right.appendChild(makeStatusSpan(online));
        row.appendChild(left); row.appendChild(right); host.appendChild(row);
      }
    }

    function renderEvents(list){
      var body = $('#eventsTbody'); if(!body) return;
      body.innerHTML = '';
      if(!list || list.length===0){
        var tr0 = document.createElement('tr');
        var td0 = document.createElement('td'); td0.colSpan=6; td0.style.color='var(--muted)'; td0.textContent='No events found';
        tr0.appendChild(td0); body.appendChild(tr0); return;
      }
      function timeOf(obj, pref){
        var h = obj[pref+'Hour']; var m = obj[pref+'Min'];
        if(h!=null && m!=null){ return pad2(h)+':'+pad2(m); }
        var t = obj[pref] || obj[pref+'Time'];
        return t ? (''+t).slice(0,5) : '--:--';
      }
      for(var i=0;i<list.length;i++){
        var ev = list[i];
        var tr = document.createElement('tr');
        var name = ev.eventName || ev.name || ev.event || ev.title || 'Event';
        var device = ev.deviceName || ev.deviceId || ev.device || '—';
        var days = Array.isArray(ev.days)? ev.days.join(' ') : (ev.daysString||ev.days||'—');
        var time = timeOf(ev,'start')+'–'+timeOf(ev,'stop');
        var onS  = (ev.onSec!=null)?ev.onSec : ((ev.workSec!=null)?ev.workSec : ((ev.cycle&&ev.cycle.on!=null)?ev.cycle.on:0));
        var offS = (ev.offSec!=null)?ev.offSec: ((ev.pauseSec!=null)?ev.pauseSec: ((ev.cycle&&ev.cycle.off!=null)?ev.cycle.off:0));
        var active = (typeof ev.active==='boolean')? ev.active : ((ev.status||'').toString().toLowerCase()==='active');
        tr.innerHTML = '<td><strong>'+name+'</strong></td>'+
                       '<td>'+device+'</td>'+
                       '<td><span class="pill">'+days+'</span></td>'+
                       '<td>'+time+'</td>'+
                       '<td>'+onS+'s / '+offS+'s</td>'+
                       '<td>'+(active? '<span class="status status--online">Active</span>':'<span class="status status--offline">Off</span>')+'</td>';
        body.appendChild(tr);
      }
    }

    function renderUsers(list){
      var body = $('#usersTbody'); if(!body) return;
      body.innerHTML = '';
      if(!list || list.length===0){
        var tr1 = document.createElement('tr');
        var td1 = document.createElement('td'); td1.colSpan=4; td1.style.color='var(--muted)'; td1.textContent='No users found';
        tr1.appendChild(td1); body.appendChild(tr1); return;
      }
      for(var i=0;i<list.length;i++){
        var u = list[i];
        var tr = document.createElement('tr');
        var email = u.email || '—';
        var role  = u.role  || '—';
        var cnt   = (typeof u.devicesCount==='number')? u.devicesCount : '—';
        tr.innerHTML = '<td><span class="pill">'+(u.id||'—')+'</span></td>'+
                       '<td>'+email+'</td>'+
                       '<td>'+role+'</td>'+
                       '<td>'+cnt+'</td>';
        body.appendChild(tr);
      }
    }

    function showUsersError(msg){
      var body = $('#usersTbody'); if(!body) return;
      body.innerHTML = '';
      var tr = document.createElement('tr'); var td = document.createElement('td');
      td.colSpan = 4; td.style.color = 'var(--danger)'; td.textContent = msg;
      tr.appendChild(td); body.appendChild(tr);
    }

    /***********************
     * LOADERS             *
     ***********************/
    var SCHEMA = {
      usersPath: 'users',
      devicesCollection: 'devices',
      eventsCollection: 'events',
      deviceOwnerField: 'ownerUid',
      eventOwnerField: 'ownerUid'
    };

    function loadDevicesAuto(user){
      function tryFlat(){
        return db.collection(SCHEMA.devicesCollection).where(SCHEMA.deviceOwnerField,'==',user.uid).get()
          .then(function(s){ var arr=[]; s.forEach(function(d){ arr.push(Object.assign({id:d.id}, d.data())); }); return arr; });
      }
      function tryNested(){
        return db.collection(SCHEMA.usersPath).doc(user.uid).collection('devices').get()
          .then(function(s){ var arr=[]; s.forEach(function(d){ arr.push(Object.assign({id:d.id}, d.data())); }); return arr; });
      }
      function tryOwnersArray(){
        return db.collection(SCHEMA.devicesCollection).where('owners','array-contains',user.uid).get()
          .then(function(s){ var arr=[]; s.forEach(function(d){ arr.push(Object.assign({id:d.id}, d.data())); }); return arr; });
      }
      return tryFlat().catch(function(){return[];}).then(function(list){
        if(list.length) return list; return tryNested().catch(function(){return[];});
      }).then(function(list){
        if(list.length) return list; return tryOwnersArray().catch(function(){return[];});
      }).then(function(list){ renderDevices(list); return list; });
    }

    /* --------- ONLY CHANGE BELOW: extended events loader ---------- */
    function loadEventsAuto(user, knownDevices){
      function snapToList(snap){
        var out=[]; snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data())); });
        return out;
      }
      function flat(){
        return db.collection(SCHEMA.eventsCollection)
                 .where(SCHEMA.eventOwnerField,'==',user.uid).get().then(snapToList);
      }
      function nested(){
        return db.collection(SCHEMA.usersPath).doc(user.uid)
                 .collection('events').get().then(snapToList);
      }
      // events under top-level devices/{deviceId}/events
      function underTopLevelDevices(){
        var all=[]; var seq = Promise.resolve();
        (knownDevices||[]).forEach(function(dev){
          var devId = dev.id || dev.deviceId; if(!devId) return;
          seq = seq.then(function(){
            return db.collection(SCHEMA.devicesCollection).doc(devId)
                     .collection('events').get()
              .then(function(s){ s.forEach(function(x){
                all.push(Object.assign({id:x.id, deviceId:devId, deviceName:(dev.name||dev.deviceName||'')}, x.data()));
              }); });
          }).catch(function(){});
        });
        return seq.then(function(){ return all; });
      }
      // **NEW** events under users/{uid}/devices/{deviceId}/events
      function underUserDevices(){
        var all=[]; var seq = Promise.resolve();
        (knownDevices||[]).forEach(function(dev){
          var devId = dev.id || dev.deviceId; if(!devId) return;
          seq = seq.then(function(){
            return db.collection('users').doc(user.uid)
                     .collection('devices').doc(devId)
                     .collection('events').get()
              .then(function(s){ s.forEach(function(x){
                all.push(Object.assign({id:x.id, deviceId:devId, deviceName:(dev.name||dev.deviceName||'')}, x.data()));
              }); });
          }).catch(function(){});
        });
        return seq.then(function(){ return all; });
      }

      // Try sources in order; prefer user-owned collections
      return flat().catch(function(){return[];}).then(function(list){
        if(list.length){ renderEvents(list); return; }
        return nested().catch(function(){return[];}).then(function(list2){
          if(list2.length){ renderEvents(list2); return; }
          return underUserDevices().then(function(list3){
            if(list3.length){ renderEvents(list3); return; }
            return underTopLevelDevices().then(function(list4){ renderEvents(list4); });
          });
        });
      });
    }
    /* --------- ONLY CHANGE ABOVE ---------------------------------- */

    function loadRegisteredUsers(){
      return db.collection('users').get().then(function(s){
        var list=[]; s.forEach(function(d){ list.push(Object.assign({id:d.id}, d.data())); });
        var limited = list.slice(0,50);
        var seq = Promise.resolve();
        for(var i=0;i<limited.length;i++){
          (function(idx, u){
            seq = seq.then(function(){
              return db.collection('users').doc(u.id).collection('devices').get()
                .then(function(sub){ list[idx].devicesCount = sub.size; })
                .catch(function(){});
            });
          })(i, limited[i]);
        }
        return seq.then(function(){
          var qEl = $('#userSearch'); var q = qEl ? qEl.value.trim().toLowerCase() : '';
          if(q){
            var f=[]; for(var i=0;i<list.length;i++){
              var em = (list[i].email||'').toLowerCase(); var rl = (list[i].role||'').toLowerCase();
              if(em.indexOf(q)!==-1 || rl.indexOf(q)!==-1){ f.push(list[i]); }
            }
            list = f;
          }
          renderUsers(list);
        });
      }).catch(function(err){
        console.error('Users load error:', err);
        showUsersError('Cannot read users (auth/rules). Sign in with Email/Password.');
      });
    }

    /***********************
     * AUTH (NO ANONYMOUS) *
     ***********************/
    function setAuthedUI(user){
      var signedIn = !!user;
      var chip = $('#userEmailChip');
      if (chip) chip.textContent = signedIn ? (user.email || 'Signed in') : 'Signed out';

      var btnLogin = $('#openLoginBtn');
      var btnLogout = $('#signOutBtn');
      if (btnLogin)  btnLogin.style.display  = signedIn ? 'none' : 'inline-block';
      if (btnLogout) btnLogout.style.display = signedIn ? 'inline-block' : 'none';
    }

    function openModal(){ var m = $('#loginModal'); if(m){ m.style.display='flex'; m.setAttribute('aria-hidden','false'); } }
    function closeModal(){ var m = $('#loginModal'); if(m){ m.style.display='none'; m.setAttribute('aria-hidden','true'); } }

    function startApp(user){
      setAuthedUI(user);
      loadDevicesAuto(user)
        .then(function(devs){ return loadEventsAuto(user, devs); })
        .then(function(){ return loadAccount(user); })
        .then(function(){ return loadRegisteredUsers(); })
        .catch(function(e){ console.error(e); });
    }

    auth.onAuthStateChanged(function(user){
      if (!user) {
        setAuthedUI(null);
        renderUsers([]);
        renderDevices([]);
        renderEvents([]);
        openModal();
        return;
      }
      startApp(user);
    });

    /***********************
     * UI: Buttons & Modal *
     ***********************/
    var openLoginBtn = $('#openLoginBtn');
    var closeLoginBtn = $('#closeLoginBtn');
    var doLoginBtn    = $('#doLoginBtn');
    var signOutBtn    = $('#signOutBtn');

    if (openLoginBtn) openLoginBtn.addEventListener('click', openModal);
    if (closeLoginBtn) closeLoginBtn.addEventListener('click', closeModal);

    if (doLoginBtn) doLoginBtn.addEventListener('click', function(){
      var email = ($('#loginEmail') && $('#loginEmail').value) || '';
      var pass  = ($('#loginPass') && $('#loginPass').value) || '';
      var msgEl = $('#loginMsg'); if(msgEl) msgEl.textContent = '';
      if(!email || !pass){
        if(msgEl) msgEl.textContent = 'Enter email and password.';
        return;
      }
      auth.signInWithEmailAndPassword(email, pass)
        .then(function(){ closeModal(); })
        .catch(function(err){
          console.error(err);
          if(msgEl) msgEl.textContent = err && err.message ? err.message : 'Sign-in failed.';
        });
    });

    if (signOutBtn) signOutBtn.addEventListener('click', function(){
      auth.signOut();
    });

    // Account tile info
    function loadAccount(user){
      return db.collection('users').doc(user.uid).get().then(function(doc){
        var data = doc.exists? doc.data() : {};
        var name = data.name || user.displayName || '—';
        var email = user.email || '—';
        var uid = user.uid;
        var el;
        el = $('#accName');  if(el) el.textContent = name;
        el = $('#accEmail'); if(el) el.textContent = email;
        el = $('#accUid');   if(el) el.textContent = uid;
        setAvatarFromName(name || email || 'U');
      });
    }

    // Other buttons
    var editBtn = $('#editProfileBtn'); if(editBtn) editBtn.addEventListener('click', function(){ alert('Edit profile clicked'); });
    var addBtn = $('#addDeviceBtn'); if(addBtn) addBtn.addEventListener('click', function(){ alert('Add device clicked'); });
    var refreshDev = $('#refreshDevicesBtn'); if(refreshDev) refreshDev.addEventListener('click', function(){ var u=auth.currentUser; if(u) loadDevicesAuto(u); });
    var refreshEvt = $('#refreshEventsBtn'); if(refreshEvt) refreshEvt.addEventListener('click', function(){ var u=auth.currentUser; if(u) loadDevicesAuto(u).then(function(devs){ return loadEventsAuto(u,devs); }); });
    var refreshUsers = $('#refreshUsersBtn'); if(refreshUsers) refreshUsers.addEventListener('click', function(){ loadRegisteredUsers(); });
    var userSearch = $('#userSearch'); if(userSearch) userSearch.addEventListener('input', function(){ loadRegisteredUsers(); });
  </script>
</body>
</html>
